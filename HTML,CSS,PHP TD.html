function stats(t){const T=TT[t.k],u=t.u,m=n=>u[n]>=5?1.6:1;const[bc,br]=t.k==='vil'?[1,1]:buff(t);return{dmg:T.dmg*(1+.45*u[0])*m(0),cd:T.cd*Math.pow(.82,u[1])/m(1)/bc,rng:T.rng>500?T.rng:T.rng*(1+.1*u[2])*br,s:u[2]}}
function canUp(t,i){const v=[...t.u];v[i]++;const s=v.sort((a,b)=>b-a);return s[0]<=5&&s[1]<=2&&s[2]===0}
function upCost(t,i){return Math.round(TT[t.k].cost*[.4,.8,1.6,3,6][t.u[i]]*(i===2?1.1:1)/5)*5}
function income(t){const u=t.u;return Math.round(TT.api.dmg*(1+.6*u[0])*(1+.4*u[1])+40*u[2])}
function TWR(t,dt){const T=TT[t.k],S=stats(t),s=S.s;t.cd-=dt;if(t.k==='api'||t.k==='vil')return;const tg=first(t);if(tg)t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);if(t.cd>0||!tg)return;t.cd=S.cd;
if(t.k==='css'||t.k==='grid'){const cs=t.k==='css';for(const b of g.bugs)if(!b.dead&&Math.hypot(b.x-t.x,b.y-t.y)<=S.rng){if(cs){b.slow=2+.7*s;b.sf=s>=3?.35:.5}hurt(b,S.dmg)}g.rings.push({x:t.x,y:t.y,r:10,max:S.rng,life:.45,col:cs?'#7fdcff':'#ffb347'});SFX.slow()}
else if(t.k==='html'||t.k==='nin'||t.k==='gat'||t.k==='sup'){const n=t.k==='html'?1+(s>=2)+(s>=4):t.k==='nin'?2+(s>=3)+(s>=5):1+(s>=3);g.bugs.filter(b=>!b.dead&&Math.hypot(b.x-t.x,b.y-t.y)<=S.rng).sort((a,b)=>b.d-a.d).slice(0,n).forEach(b=>g.proj.push({x:t.x,y:t.y,tg:b,tx:b.x,ty:b.y,dmg:S.dmg,k:t.k}));SFX.shoot()}
else if(t.k==='php'){g.proj.push({x:t.x,y:t.y,tg,tx:tg.x,ty:tg.y,dmg:S.dmg,k:'php',sr:48+8*s});SFX.cannon()}
else if(t.k==='sql'){hurt(tg,S.dmg*(1+.25*s));g.rings.push({x:tg.x,y:tg.y,r:4,max:20,life:.25,col:'#fff'});spark(tg.x,tg.y,'#fff',5);tone(1400,.1,'sawtooth',.04,300)}
else if(t.k==='js'){const hit=[tg];let cur=tg;for(let i=0;i<2+s&&cur;i++){hurt(cur,S.dmg);g.rings.push({x:cur.x,y:cur.y,r:3,max:16,life:.25,col:'#e0a8ff'});const c=cur;cur=g.bugs.find(b=>!b.dead&&!hit.includes(b)&&Math.hypot(b.x-c.x,b.y-c.y)<75);if(cur)hit.push(cur)}SFX.slow()}}

const DIF=[{n:'ง่าย (Easy)',r:40,h:.8,gold:500},{n:'ปานกลาง (Medium)',r:60,h:1,gold:400},{n:'ยาก (Hard)',r:80,h:1.25,gold:300}];
const LY=[['#e04040',80],['#3b82e8',100],['#46c24a',120],['#f5d02e',165],['#ff7eb6',185],['#2c2c34',160],['#c04fd6',190]];const LH=()=>10*g.dm;const lvl=r=>{const b=Math.min(6,(r-1)/5|0);return Math.max(0,b-(Math.random()<.5?1:0))};
function buff(t){let c=1,r=1;for(const o of g.towers)if(o.k==='vil'&&Math.hypot(o.x-t.x,o.y-t.y)<=TT.vil.rng*(1+.1*o.u[2])){c=Math.max(c,1.12+.06*o.u[0]);r=Math.max(r,1.05+.04*o.u[1])}return[c,r]}
const hmul=r=>(1+.1*(Math.min(r,10)-1)+.05*Math.max(0,r-10))*g.dm;
function mk(ty,d,hm,ly0){const T=BT[ty],hp=T.hp*hm,p=posAt(Math.max(0,d));T.bl=!!T.ch;const ly=ty==='syn'?(ly0||0):0,h=ty==='syn'?LH():hp;return{ty,ly,hp:h,mx:h,hm,d:Math.max(0,d),slow:0,dg:0,dc:1+Math.random()*2,x:p[0],y:p[1],age:0,dead:false}}
function wave(r){if(r<=10)return WV[r-1];const w=[['syn',10+(r*.8|0),Math.max(.15,.5-r*.005)],['lay',6+(r*.5|0),Math.max(.25,.7-r*.006)]];if(r%5===0)w.push(['nf',1+(r/15|0),3]);if(r>=12&&r%3===0)w.push(['moab',1+((r-12)/18|0),4]);if(r>=28&&r%4===0)w.push(['bfb',1+((r-28)/24|0),6]);if(r>=45&&r%5===0)w.push(['zomg',1+((r-45)/25|0),8]);return w}
function pickDif(){showCard('<h2>เลือกระดับความยาก</h2>'+DIF.map((d,i)=>`<button class='big ans' data-i='${i}'>${d.n}<small style='display:block;font-size:13px;font-weight:600'>${d.r} รอบ · เหรียญเริ่มต้น ${d.gold} · Bug เลือด ${Math.round(d.h*100)}%</small></button>`).join('')+'<small>มี M.O.A.B., BFB และ ZOMG ในรอบหลัง ๆ (ZOMG มาตั้งแต่รอบ 45)</small>');document.querySelectorAll('#card .ans').forEach(b=>b.onclick=()=>{const d=DIF[+b.dataset.i];g.max=d.r;g.dm=d.h;g.gold=d.gold;closeModal();hud()})}
function valid(x,y,k){if(x<20||x>W-20||y<20||y>H-20||onRoad(x,y)||g.gold<TT[k].cost)return false;return !g.towers.some(t=>Math.hypot(t.x-x,t.y-y)<36)}
function first(t){let b=null;const R=stats(t).rng;for(const e of g.bugs)if(!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<=R&&(!b||e.d>b.d))b=e;return b}
function spark(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*90;g.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,col,r:2+Math.random()*3})}}
function hurt(b,d){if(b.dead)return;b.hp-=d;if(b.ty==='syn')while(b.hp<=0&&b.ly>0){spark(b.x,b.y,LY[b.ly][0],5);g.gold+=1;b.ly--;b.hp+=LH();b.mx=LH()}if(b.hp<=0){b.dead=true;g.gold+=BT[b.ty].g;SFX.coin();spark(b.x,b.y,'#ffd35c',8);const c=BT[b.ty].ch;if(c)for(let i=0;i<c[1];i++)g.sp.push(mk(c[0],b.d-i*16,b.hm,c[2]));hud()}}
function build(r){const q=[];let t=0;for(const[ty,n,gp]of wave(r)){for(let i=0;i<n;i++){q.push({t,ty});t+=gp}t+=1.5}return q}
function end(win){g.over=true;g.running=false;win?SFX.ok():SFX.over();
showCard(`<h2>${win?'🏆 ชนะแล้ว! เซิร์ฟเวอร์ปลอดภัย':'💥 GAME OVER'}</h2><p>${win?'คุณป้องกัน Bug ครบทั้ง 10 รอบ เก่งมาก!':'เซิร์ฟเวอร์ถูก Bug บุกทำลาย ลองทบทวนคู่มือโค้ดแล้วสู้ใหม่อีกครั้ง'}</p><button class="big" id="rs">เล่นอีกครั้ง</button>`);
$('rs').onclick=()=>{closeModal();init()}}
function step(dt){
g.clock+=dt;
while(g.queue.length&&g.queue[0].t<=g.clock){const q=g.queue.shift();g.bugs.push(mk(q.ty,0,hmul(g.round),q.ty==='syn'?lvl(g.round):0))}
for(const b of g.bugs){if(b.dead)continue;const T=BT[b.ty];b.age+=dt;b.slow=Math.max(0,b.slow-dt);let m=b.slow>0?(b.sf||.5):1;
if(b.ty==='lay'){b.dc-=dt;if(b.dc<=0){b.dg=.45;b.dc=2+Math.random()*1.5}if(b.dg>0){b.dg-=dt;m*=2.4}}
b.d+=(b.ty==='syn'?LY[b.ly][1]:T.sp)*m*dt;
if(b.d>=TOT){b.dead=true;g.hp-=b.ty==='syn'?b.ly+1:T.dm;SFX.hit();hud();if(g.hp<=0){g.hp=0;hud();end(false);return}continue}
const p=posAt(b.d);b.x=p[0];b.y=p[1]+(b.dg>0?Math.sin(b.age*30)*9:0)}
g.bugs=g.bugs.filter(b=>!b.dead);
for(const t of g.towers)TWR(t,dt);for(const t of []){t.cd-=dt;const T=TT[t.k],tg=first(t);if(tg)t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);if(t.cd>0||!tg)continue;t.cd=T.cd[t.l];
if(t.k==='css'){const R=T.rng[t.l];for(const b of g.bugs)if(!b.dead&&Math.hypot(b.x-t.x,b.y-t.y)<=R){b.slow=2;hurt(b,T.dmg[t.l])}g.rings.push({x:t.x,y:t.y,r:10,max:R,life:.45,col:'#7fdcff'});SFX.slow()}
else{g.proj.push({x:t.x,y:t.y,tg,tx:tg.x,ty:tg.y,dmg:T.dmg[t.l],k:t.k});t.k==='html'?SFX.shoot():SFX.cannon()}}
g.bugs=g.bugs.filter(b=>!b.dead);
for(const p of g.proj){if(!p.tg.dead){p.tx=p.tg.x;p.ty=p.tg.y}const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),s=(p.k==='php'?300:460)*dt;
if(d<=s+3){p.done=1;if(p.k==='php'){for(const b of g.bugs)if(!b.dead&&Math.hypot(b.x-p.tx,b.y-p.ty)<=(p.sr||48))hurt(b,p.dmg);g.rings.push({x:p.tx,y:p.ty,r:6,max:p.sr||48,life:.35,col:'#ffb347'});spark(p.tx,p.ty,'#ff8a3d',10);SFX.boom()}else if(!p.tg.dead){hurt(p.tg,p.dmg);spark(p.tx,p.ty,'#fff',3)}}else{p.x+=dx/d*s;p.y+=dy/d*s}}
g.proj=g.proj.filter(p=>!p.done);g.bugs=g.bugs.filter(b=>!b.dead).concat(g.sp.splice(0));
for(const r of g.rings){r.life-=dt;r.r+=(r.max-r.r)*Math.min(1,dt*9)}g.rings=g.rings.filter(r=>r.life>0);
for(const f of g.fx){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt}g.fx=g.fx.filter(f=>f.life>0);
if(g.running&&!g.queue.length&&!g.bugs.length&&!g.over){g.running=false;const bn=60+g.round*10+g.towers.reduce((a,t)=>a+(t.k==='api'?income(t):0),0);g.gold+=bn;SFX.coin();if(g.round>=g.max)end(true);else toast('ผ่านรอบที่ '+g.round+'! โบนัส +'+bn+' 🪙');hud()}}

function drawBug(b){const T=BT[b.ty],r=T.r;X.save();X.translate(b.x,b.y);
X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(0,r*.85,r,r*.4,0,0,7);X.fill();
X.fillStyle=b.slow>0?'#7fdcff':(b.ty==='syn'?LY[b.ly][0]:T.col);X.lineWidth=3;X.strokeStyle='#2b1606';
if(b.ty==='lay'){X.rotate(Math.sin(b.age*8)*.2);rr(-r,-r,r*2,r*2,5)}else if(T.bl){const a1=posAt(b.d+4),a0=posAt(Math.max(0,b.d-4));X.beginPath();X.ellipse(0,0,r*1.35,r,Math.atan2(a1[1]-a0[1],a1[0]-a0[0]),0,7)}else if(b.ty==='syn'){X.beginPath();X.ellipse(0,-1,r*.85,r*1.1,0,0,7)}else{X.beginPath();X.arc(0,0,r,0,7)}
X.fill();X.stroke();X.fillStyle='rgba(255,255,255,.3)';X.beginPath();X.arc(-r*.3,-r*.4,r*.28,0,7);X.fill();
if(T.bl||b.ty==='nf'){X.fillStyle='#fff';X.font='700 '+(T.bl?11:14)+'px monospace';X.textAlign='center';X.fillText(T.lb||'404',0,4)}
else{for(const ex of[-1,1]){X.fillStyle='#fff';X.beginPath();X.arc(ex*r*.38,-r*.1,r*.28,0,7);X.fill();X.fillStyle='#111';X.beginPath();X.arc(ex*r*.38+1,-r*.1,r*.13,0,7);X.fill()}}
X.restore();
if(b.hp<b.mx){X.fillStyle='#3b0d0d';X.fillRect(b.x-14,b.y-r-9,28,5);X.fillStyle='#5cf06a';X.fillRect(b.x-14,b.y-r-9,28*Math.max(0,b.hp/b.mx),5)}}
function draw(t){X.drawImage(BG,0,0);drawBase(t);
if(g.sel){const T=TT[g.sel.k];X.fillStyle='rgba(255,255,255,.18)';X.strokeStyle='rgba(255,255,255,.8)';X.lineWidth=2;X.beginPath();X.arc(g.sel.x,g.sel.y,g.sel.k==='sql'?0:stats(g.sel).rng,0,7);X.fill();X.stroke()}
for(const o of g.towers)drawTower(o.k,o.x,o.y,o.u,1,o.k==='api'||o.k==='vil'?undefined:o.ang);
for(const b of g.bugs)drawBug(b);
for(const p of g.proj){X.beginPath();X.fillStyle=p.k==='php'?'#b79bff':'#fff';X.strokeStyle=TT[p.k].col;X.lineWidth=3;X.arc(p.x,p.y,p.k==='php'?7:4,0,7);X.fill();X.stroke()}
for(const r of g.rings){X.globalAlpha=Math.max(0,r.life*2);X.strokeStyle=r.col;X.lineWidth=5;X.beginPath();X.arc(r.x,r.y,r.r,0,7);X.stroke();X.globalAlpha=1}
for(const f of g.fx){X.globalAlpha=Math.max(0,f.life*2);X.fillStyle=f.col;X.beginPath();X.arc(f.x,f.y,f.r,0,7);X.fill();X.globalAlpha=1}
if(g.place&&g.mx>=0){const k=g.place,ok=valid(g.mx,g.my,k);X.fillStyle=ok?'rgba(76,175,80,0.4)':'rgba(244,67,54,0.4)';X.strokeStyle=ok?'#2e8b32':'#b3261e';X.lineWidth=3;X.beginPath();X.arc(g.mx,g.my,Math.min(Math.max(TT[k].rng,30),140),0,7);X.fill();X.stroke();drawTower(k,g.mx,g.my,0,.8)}}

function mpos(e){const r=C.getBoundingClientRect();g.mx=(e.clientX-r.left)*W/r.width;g.my=(e.clientY-r.top)*H/r.height}
C.addEventListener('pointermove',mpos);
C.addEventListener('contextmenu',e=>{e.preventDefault();g.place=null;hud()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&g&&g.place){g.place=null;hud()}});
C.addEventListener('pointerdown',e=>{if(g.over||g.pause)return;mpos(e);const x=g.mx,y=g.my;
if(g.place){const k=g.place;if(!valid(x,y,k)){toast(g.gold<TT[k].cost?'เหรียญไม่พอ!':'วางตรงนี้ไม่ได้ (ทับถนนหรือป้อมอื่น)');return}
g.place=null;hud();ask(TT[k].q,()=>{g.gold-=TT[k].cost;g.towers.push({k,x,y,u:[0,0,0],cd:0,inv:TT[k].cost,ang:0});SFX.coin();hud()});return}
let best=null,bd=24;for(const t of g.towers){const d=Math.hypot(t.x-x,t.y-y);if(d<bd){bd=d;best=t}}g.sel=best;hud()});

g.round++;g.queue=build(g.round);g.clock=0;g.running=true;g.place=null;tone(440,.12,'triangle',.06,660);hud()};

function loop(n){const dr=Math.min(.05,(n-last)/1000);last=n;if(!g.pause&&!g.over)for(let i=0;i<g.speed;i++)step(dr);draw(n/1000);requestAnimationFrame(loop)}
